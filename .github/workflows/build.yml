name: Build ArjunBiswasMediaPlayer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        include:
          - os: macos-latest
            artifact_name: ArjunBiswasMediaPlayer.app
            build_dir: build
            cmake_args: -DCMAKE_BUILD_TYPE=Release

          - os: windows-latest
            artifact_name: ArjunBiswasMediaPlayer.exe
            build_dir: build
            cmake_args: -DCMAKE_BUILD_TYPE=Release

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install CMake (macOS & Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            brew install cmake ninja
          else
            sudo apt-get update
            sudo apt-get install -y cmake ninja-build
          fi
        shell: bash

      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install vcpkg
        uses: lukka/get-cmake@latest

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ${{ runner.temp }}/vcpkg_cache
            ~/.cache/vcpkg
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            vcpkg-${{ matrix.os }}-

      - name: Setup vcpkg
        run: |
          if [ -d "$RUNNER_TEMP/vcpkg" ]; then
            cd "$RUNNER_TEMP/vcpkg"
            git pull
          else
            git clone https://github.com/Microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          fi
          cd "$RUNNER_TEMP/vcpkg"
          if [ "$RUNNER_OS" == "Windows" ]; then
            ./bootstrap-vcpkg.bat
          else
            ./bootstrap-vcpkg.sh
          fi
        shell: bash

      - name: Configure Project (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -S . -B ${{ matrix.build_dir }} \
            -DCMAKE_TOOLCHAIN_FILE=${{ runner.temp }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            ${{ matrix.cmake_args }}
        env:
          VCPKG_FEATURE_FLAGS: manifests

      - name: Configure Project (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B ${{ matrix.build_dir }} -DCMAKE_TOOLCHAIN_FILE="${{ runner.temp }}/vcpkg/scripts/buildsystems/vcpkg.cmake" ${{ matrix.cmake_args }}
        env:
          VCPKG_FEATURE_FLAGS: manifests
        shell: cmd

      - name: Build Project
        run: |
          cmake --build ${{ matrix.build_dir }} --config Release --parallel

      - name: Upload Artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ArjunBiswasMediaPlayer-macOS
          path: ${{ matrix.build_dir }}/ArjunBiswasMediaPlayer.app
          retention-days: 30

      - name: Upload Artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ArjunBiswasMediaPlayer-Windows
          path: ${{ matrix.build_dir }}/Release/ArjunBiswasMediaPlayer.exe
          retention-days: 30

  create-release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ArjunBiswasMediaPlayer-Windows/*
            ArjunBiswasMediaPlayer-macOS/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
