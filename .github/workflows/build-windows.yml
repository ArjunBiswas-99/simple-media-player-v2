name: Build Windows

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main]

jobs:
    build-windows:
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v3

            - name: Setup MSVC
              uses: microsoft/setup-msbuild@v1.1

            - name: Install CMake and Ninja
              run: |
                  choco install cmake ninja -y

            - name: Clone Dear ImGui
              run: |
                  git clone https://github.com/ocornut/imgui.git external/imgui

            - name: Download FFmpeg
              run: |
                  # TODO: Download and extract FFmpeg pre-built binaries
                  # https://github.com/BtbN/FFmpeg-Builds/releases
                  echo "FFmpeg download will be added in Phase 2"

            - name: Configure CMake
              run: |
                  cmake -G "Visual Studio 17 2022" -A x64 -B build

            - name: Build
              run: |
                  cmake --build build --config Release

            - name: Upload artifact
              uses: actions/upload-artifact@v3
              with:
                  name: MediaPlayer-Windows
                  path: build/Release/MediaPlayer.exe

            - name: Create installer (Optional)
              run: |
                  # TODO: Create NSIS installer in future
                  echo "Installer creation will be added later"
